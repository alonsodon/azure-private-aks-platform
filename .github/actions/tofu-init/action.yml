name: tofu-init
description: Install OpenTofu, log in to Azure with OIDC, initialise infra/ for one stage and open the Key Vault firewall for this runner

inputs:
  stage:
    description: dev or prod (selects environments/<stage>.backend.hcl)
    required: true

outputs:
  key_vault:
    description: Key Vault whose firewall was opened ('' if it does not exist yet)
    value: ${{ steps.firewall.outputs.key_vault }}
  runner_ip:
    description: Public IP of this runner
    value: ${{ steps.firewall.outputs.runner_ip }}

runs:
  using: composite
  steps:
    - uses: opentofu/setup-opentofu@v1
      with:
        tofu_version: 1.13.1
        tofu_wrapper: false # plain stdout, so outputs can be captured in scripts

    # az CLI session, only for the firewall steps (OpenTofu gets its own token through ARM_USE_OIDC)
    - uses: azure/login@v2
      with:
        client-id: ${{ env.ARM_CLIENT_ID }}
        tenant-id: ${{ env.ARM_TENANT_ID }}
        subscription-id: ${{ env.ARM_SUBSCRIPTION_ID }}

    - name: tofu init (${{ inputs.stage }})
      shell: bash
      working-directory: infra
      run: |
        tofu init -input=false \
          -backend-config="subscription_id=${ARM_SUBSCRIPTION_ID}" \
          -backend-config="resource_group_name=${TF_STATE_RESOURCE_GROUP}" \
          -backend-config="storage_account_name=${TF_STATE_STORAGE_ACCOUNT}" \
          -backend-config="container_name=tfstate" \
          -backend-config="use_azuread_auth=true" \
          -backend-config="environments/${{ inputs.stage }}.backend.hcl"

    - name: Open the Key Vault firewall for this runner (D41)
      id: firewall
      shell: bash
      working-directory: infra
      run: |
        RUNNER_IP=$(curl -s https://api.ipify.org)
        echo "runner_ip=${RUNNER_IP}" >> "$GITHUB_OUTPUT"
        # Desired state includes the runner IP too, so OpenTofu sees no drift
        echo "TF_VAR_runner_ip_cidrs=[\"${RUNNER_IP}/32\"]" >> "$GITHUB_ENV"
        KV=$(tofu output -raw key_vault_name 2>/dev/null || true)
        echo "key_vault=${KV}" >> "$GITHUB_OUTPUT"
        if [ -n "$KV" ]; then
          az keyvault network-rule add --name "$KV" --ip-address "${RUNNER_IP}/32" -o none
          sleep 30 # firewall rules take a moment to apply
        fi
