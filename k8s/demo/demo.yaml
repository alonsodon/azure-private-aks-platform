apiVersion: v1
kind: Namespace
metadata:
  name: demo
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kv-reader
  namespace: demo
  annotations:
    azure.workload.identity/client-id: "__CLIENT_ID__" # replaced at apply time; no IDs in Git
---
apiVersion: v1
kind: Pod
metadata:
  name: kv-probe
  namespace: demo
  labels:
    azure.workload.identity/use: "true" # the webhook injects the token file and AZURE_* variables
spec:
  serviceAccountName: kv-reader
  containers:
    - name: azcli
      image: mcr.microsoft.com/azure-cli:2.67.0
      command: ["sleep", "infinity"]
